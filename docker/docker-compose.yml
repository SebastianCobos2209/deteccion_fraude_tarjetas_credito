version: "3.8"

services:
  # ─────────────────────────────────────────
  # ZOOKEEPER — coordinador de Kafka
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # KAFKA BROKER — motor de mensajería
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # KAFKA UI — interfaz visual
  # Acceder en: http://localhost:8080
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # MONGODB — almacenamiento de transacciones
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tfm2026
      MONGO_INITDB_DATABASE: fraude_db
    volumes:
      - ../data/mongodb:/data/db
      - ../mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # MONGO EXPRESS — interfaz visual MongoDB
  # Acceder: http://localhost:8081
  # ─────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: tfm2026
      ME_CONFIG_MONGODB_URL: mongodb://admin:tfm2026@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: tfm2026
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # SPARK MASTER — coordinador del cluster
  # Acceder: http://localhost:4040 (Spark UI)
  # ─────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "4040:8080" # Spark Web UI
      - "7077:7077" # Spark Master port
    volumes:
      - ../spark:/opt/spark_app
      - ../models:/opt/spark_models
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # SPARK WORKER — ejecutor de tareas
  # ─────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ../spark:/opt/spark_app
      - ../models:/opt/spark_models
    depends_on:
      - spark-master
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # SPARK SUBMIT — ejecuta main.py
  # Entry point: spark/main.py
  # MongoDB desactivado (MONGO_ENABLED=false)
  # ─────────────────────────────────────────
  spark-submit:
    image: apache/spark:3.5.1
    container_name: spark-submit
    user: root
    environment:
      - KAFKA_BROKER=kafka:29092
      - MONGO_URI=mongodb://admin:tfm2026@mongodb:27017/fraude_db?authSource=admin
      - MONGO_ENABLED=true
      - SPARK_MASTER=spark://spark-master:7077
      - WARMUP_SIZE=2000
      - FRAUD_THRESHOLD=0.5
      - RETRAIN_INTERVAL=300
      - PYTHONPATH=/opt/spark_app
    volumes:
      - ../spark:/opt/spark_app
      - ../models:/opt/spark_models
    command:
      - /bin/bash
      - -c
      - |
          pip install scikit-learn==1.3.2 joblib==1.3.2 pymongo==4.6.0 numpy==1.24.4 --quiet && \
          exec /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0 \
            --conf spark.mongodb.write.connection.uri="mongodb://admin:tfm2026@mongodb:27017/fraude_db?authSource=admin" \
            --conf spark.mongodb.read.connection.uri="mongodb://admin:tfm2026@mongodb:27017/fraude_db?authSource=admin" \
            /opt/spark_app/main.py
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: on-failure
    networks:
      - fraud_net

  # ─────────────────────────────────────────
  # GRAFANA — visualización del dashboard en tiempo real
  # Acceder: http://localhost:3000 (Credenciales: admin/admin)
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=https://github.com/haohanyang/mongodb-datasource/releases/download/v0.3.2/haohanyang-mongodb-datasource-0.3.2.zip;haohanyang-mongodb-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=haohanyang-mongodb-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fraud_net

networks:
  fraud_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  grafana_data:
    driver: local